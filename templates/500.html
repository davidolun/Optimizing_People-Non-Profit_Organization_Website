{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - Optimizing People</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'images/logos.png' %}">
    <style>
        :root {
            --primary-color: #2c5aa0;
            --secondary-color: #f8b500;
            --accent-color: #e74c3c;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .error-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
        }
        .error-number {
            font-size: clamp(6rem, 20vw, 10rem);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--accent-color), #c0392b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .error-icon {
            font-size: 3rem;
            color: var(--accent-color);
            margin-bottom: 1rem;
        }
        .divider {
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-color), var(--secondary-color));
            border-radius: 2px;
            margin: 1.5rem auto;
        }
        .btn-home {
            background: linear-gradient(135deg, var(--primary-color), #1a3f7a);
            color: white;
            border: none;
            padding: 14px 36px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(44, 90, 160, 0.35);
            color: white;
        }
        .btn-refresh {
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            padding: 12px 32px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
            cursor: pointer;
            background: none;
        }
        .btn-refresh:hover {
            background: var(--accent-color);
            color: white;
            transform: translateY(-2px);
        }
        footer {
            background: #2c3e50;
            color: rgba(255,255,255,0.6);
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <section class="error-section">
        <div class="text-center">
            <div class="error-number">500</div>
            <div class="divider"></div>
            <i class="fas fa-tools error-icon"></i>
            <h2 class="fw-bold mb-3" style="color: #2c3e50; font-size: 1.8rem;">Something Went Wrong</h2>
            <p class="text-muted mb-2" style="max-width: 460px; margin: 0 auto 1rem; font-size: 1rem; line-height: 1.7;">
                We're experiencing a temporary issue on our end. Our team has been notified and is working to fix it.
            </p>
            <p class="text-muted mb-4" style="max-width: 460px; margin: 0 auto 2rem; font-size: 0.9rem;">
                Please try again in a few moments.
            </p>
            <div class="d-flex flex-wrap gap-3 justify-content-center">
                <a href="/" class="btn-home">
                    <i class="fas fa-home me-2"></i>Go Home
                </a>
                <button onclick="window.location.reload()" class="btn-refresh">
                    <i class="fas fa-redo me-2"></i>Try Again
                </button>
            </div>
        </div>
    </section>

    <footer>
        &copy; Optimizing People &mdash; Sharing Christ's Love with the World
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
