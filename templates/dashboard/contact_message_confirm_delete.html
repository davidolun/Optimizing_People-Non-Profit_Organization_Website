{% extends 'dashboard/base_dashboard.html' %}
{% block content %}
<div class="mb-5 d-flex justify-content-between align-items-center">
    <a href="{% url 'dashboard:contact_message_list' %}" class="btn btn-sm btn-outline-secondary me-3 rounded-pill px-3 fw-medium"><i class="fas fa-chevron-left"></i> Go Back</a>
    <h1 class="fw-bold mb-0 text-danger" style="letter-spacing: -1px;"><i class="fas fa-exclamation-circle me-2"></i> Delete Message</h1>
</div>

<div class="card border-0 mb-5 rounded-4 overflow-hidden mx-auto" style="max-width: 600px; background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 4px 15px rgba(0,0,0,0.03); backdrop-filter: blur(10px);">
    <div class="card-body p-5 text-center">
        <i class="fas fa-trash fa-4x mb-4 d-block" style="color: #ff3b30; opacity: 0.8;"></i>
        
        <h3 class="mb-2 fw-bold" style="color: #1d1d1f; letter-spacing: -0.5px;">Delete this Message?</h3>
        <p class="fs-5 text-secondary w-75 mx-auto">You are about to permanently delete the message from <span class="fw-medium" style="color: #1d1d1f;">{{ object.name }}</span> titled:
            <br>
            <strong class="text-dark bg-secondary bg-opacity-10 px-3 py-1 rounded-pill mt-3 d-inline-block">{{ object.subject }}</strong>
        </p>
        
        <form method="post" class="mt-5 pt-4 border-top border-secondary border-opacity-10 mx-auto">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'dashboard:contact_message_list' %}" class="btn btn-lg px-5 rounded-pill fw-medium" style="background-color: transparent; border: 1px solid rgba(0,0,0,0.1); color: #515154;">Cancel</a>
                <button type="submit" class="btn btn-lg px-5 rounded-pill shadow-sm fw-medium" style="background-color: #ff3b30; color: white;"><i class="fas fa-trash me-2"></i> Delete</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
