{% extends 'dashboard/base_dashboard.html' %}
{% load crispy_forms_tags %}
{% block content %}

<div class="mb-5">
    <a href="{{ back_url }}" class="btn btn-sm btn-outline-secondary mb-3 rounded-pill px-3 fw-medium"><i class="fas fa-chevron-left me-1"></i> Back to Data Cards</a>
    <h1 class="fw-bold mb-1" style="color: #1d1d1f; letter-spacing: -1px;">Edit {{ item_type }}</h1>
    <p class="fs-5 mb-0" style="color: #515154; font-weight: 400;">For event: <strong style="color: #1d1d1f;">{{ event.title }}</strong></p>
</div>

<div class="card border-0 rounded-4 mb-5 overflow-hidden w-75" style="background: rgba(255,255,255,0.8); border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 4px 15px rgba(0,0,0,0.03); backdrop-filter: blur(10px);">
    <div class="card-body p-4 p-md-5">
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="mt-5 pt-4 d-flex justify-content-end" style="border-top: 1px solid rgba(0,0,0,0.05);">
                <a href="{{ back_url }}" class="btn px-4 me-3 rounded-pill fw-medium" style="background-color: transparent; border: 1px solid rgba(0,0,0,0.1); color: #515154;">Cancel</a>
                <button type="submit" class="btn px-5 rounded-pill shadow-sm fw-medium" style="background-color: #0071e3; color: white;"><i class="fas fa-check me-2"></i> Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
