{% extends 'dashboard/base_dashboard.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="mb-5 d-flex justify-content-between align-items-center w-75 mx-auto">
    <div>
        <a href="{% url 'dashboard:event_gallery' event.id %}" class="btn btn-sm btn-outline-secondary mb-3 rounded-pill px-3 fw-medium"><i class="fas fa-chevron-left me-1"></i> Back to Gallery</a>
        <h1 class="fw-bold mb-0" style="color: #1d1d1f; letter-spacing: -1px;">Upload Gallery Image</h1>
    </div>
</div>

<div class="card border-0 rounded-4 mb-5 overflow-hidden w-75 mx-auto" style="background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 4px 15px rgba(0,0,0,0.03); backdrop-filter: blur(10px);">
    <div class="card-body p-4 p-md-5">
        <h5 class="fw-bold mb-4" style="color: #1d1d1f; letter-spacing: -0.5px;">Event: <span style="font-weight: 500;">{{ event.title }}</span></h5>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="alert mt-4 p-3 rounded-4 border-0 mb-4" style="background-color: rgba(0, 113, 227, 0.05); color: #0071e3;">
                <i class="fas fa-cloud-upload-alt me-2"></i> Images securely upload directly to Cloudinary global CDN network.
            </div>
            
            {{ form|crispy }}

            <div class="mt-5 pt-4 d-flex justify-content-end" style="border-top: 1px solid rgba(0,0,0,0.05);">
                <a href="{% url 'dashboard:event_gallery' event.id %}" class="btn px-4 me-3 rounded-pill fw-medium" style="background-color: transparent; border: 1px solid rgba(0,0,0,0.1); color: #515154;">Cancel</a>
                <button type="submit" class="btn px-5 rounded-pill shadow-sm fw-medium" style="background-color: #0071e3; color: white;"><i class="fas fa-upload me-2"></i> Upload Photo</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
